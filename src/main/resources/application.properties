spring.application.name=backend-pulseira

# Usa o Atlas quando MONGO_URL estiver definida; usa MongoDB local como alternativa.
spring.mongodb.uri=${MONGO_URL:mongodb://localhost:27017/pulseira_db}
spring.data.mongodb.auto-index-creation=true
spring.mongodb.database=pulseira_db

# A porta padrao da API. A NodeMCU deve usar o IP local deste computador, nunca localhost.
server.port=8080

# Origens do site autorizadas a chamar a API (separadas por virgula).
# Para o site publicado no GitHub Pages, acrescente https://joaopedrinho013.github.io
zelo.cors.origins=${ZELO_CORS_ORIGINS:http://localhost:5173}

# Administrador inicial (opcional): criado na subida se as duas variaveis existirem.
zelo.admin.email=${ZELO_ADMIN_EMAIL:}
zelo.admin.senha=${ZELO_ADMIN_SENHA:}
