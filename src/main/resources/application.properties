spring.application.name=backend-pulseira

# Usa o Atlas quando MONGO_URL estiver definida; usa MongoDB local como alternativa.
spring.mongodb.uri=${MONGO_URL:mongodb://localhost:27017/pulseira_db}
spring.data.mongodb.auto-index-creation=true
spring.mongodb.database=pulseira_db

# A porta padrao da API. A NodeMCU deve usar o IP local deste computador, nunca localhost.
server.port=8080
