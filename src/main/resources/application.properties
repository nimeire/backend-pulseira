# ========================================================
# CONFIGURAÇÕES GERAIS DA APLICAÇÃO
# ========================================================
spring.application.name=backend-pulseira
server.port=${PORT:8080}

# ========================================================
# BANCO DE DADOS (MONGODB)
# Fallback automático para a instância local caso MONGODB_URI não seja definida
# ========================================================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pulseira_db}
# spring.data.mongodb.database=${NAME_DATA:pulseira_db}

# ========================================================
# SEGURANÇA E AUTENTICAÇÃO (JWT)
# 86400000 ms = 24 horas de validade do token
# ========================================================
security.jwt.secret=${JWT_SECRET:MinhaChaveSuperSecretaDoProjetoZeloPulseiraFatecPG2026ComMaisDe256BitsSegura!}
security.jwt.expiration-ms=86400000

# ========================================================
# INTEGRAÇÃO FRONT-END (CORS)
# Portas locais padrão do Vite e React
# ========================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}